name: release-assets

# On a version tag: build the wheel/sdist, generate a CycloneDX SBOM, and attach a Sigstore-signed SLSA
# build-provenance attestation for both. Consumers verify with:
#   gh attestation verify verel-X.Y.Z-py3-none-any.whl --repo amitpatole/verel
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # attach assets to the GitHub release
  id-token: write        # keyless Sigstore signing
  attestations: write    # store the provenance attestation

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: SBOM (CycloneDX)
        run: tools/release_sbom.sh "$(ls dist/*.whl)" "sso,otel,media"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cdx.json
      - name: Attach to the release (if it exists)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.cdx.json --clobber || echo "release not created yet; SBOM kept as a workflow artifact"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-and-sbom
          path: dist/*
